name: Bug report
description: The check reported the wrong thing, or would not run
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the tool exits 2 on a machine where the toolchain really is installed, the
        "Toolchain not found (exit 2)" template asks the right questions instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `android-16kb-check --version`
      placeholder: android-16kb-check 1.0.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: android-16kb-check app-release.aab
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed, and the exit code
      description: >
        The output matters more than a description of it, especially the
        `==> objdump` and `==> archive` lines: they say which tools were picked.
        Add `echo $?` after the run.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >
        If Play and this tool disagree, say which way round. "Play rejected an
        artifact this passed" and "this failed an artifact Play accepted" are
        very different bugs.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        How to get an artifact that shows it, for example the dependency or
        `.so` that triggers it, or a small APK built with `test/fixtures/make-fixtures.py`.
        Do not attach a private app.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - bash version (`bash --version`):
        - NDK version, and how it was found (`--ndk`, `ANDROID_NDK_HOME`, `ANDROID_HOME`):
        - `bundletool` or `zipalign` version:
        - How the artifact was built (AGP version, Gradle, Flutter, other):
    validations:
      required: true
  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use an AI tool to write this issue?
      options:
        - "No"
        - "Yes, for parts"
        - "Yes, mostly"
    validations:
      required: true
  - type: input
    id: ai-tool
    attributes:
      label: If yes, which tool and model?
      description: Required if you answered yes above, for example "Claude Code, Opus 5.5" or "Copilot, GPT-5".
  - type: checkboxes
    id: own-words
    attributes:
      label: Your own words
      options:
        - label: I wrote this issue in my own words.
          required: true
